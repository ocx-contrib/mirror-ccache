extends: ../mirror-base.yml

name: ccache

# Logical index package `ccache/ccache` at the physical path
# `ghcr.io/ocx-contrib/ccache/ccache` — slash segments, never hyphen-flattened.
# The first segment must be this repo's own GitHub owner: GITHUB_TOKEN only
# authorises packages owned by the repo the workflow runs in.
#
# Upstream's owner is the org `ccache` and the tool is `ccache`, so namespace
# and name coincide under the two-segment schema rule.
#
# Succeeds the flat `ocx.sh/ccache` coordinate this repository published before
# the grouped layout, the same way mirror-kitware/cmake succeeds mirror-cmake.
target:
  registry: ghcr.io
  repository: ocx-contrib/ccache/ccache

source:
  type: github_release
  owner: ccache
  repo: ccache
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# Upstream ships TWO Linux builds per arch. Measured on v4.13.6:
#
#   ccache-4.13.6-linux-x86_64-musl-static/ccache
#     ELF 64-bit LSB pie executable, x86-64, static-pie linked, stripped
#     readelf -l | grep INTERP → (none)   readelf -d | grep NEEDED → (none)
#   ccache-4.13.6-linux-aarch64-musl-static/ccache
#     ELF 64-bit LSB pie executable, ARM aarch64, static-pie linked, stripped
#     readelf -l | grep INTERP → (none)   readelf -d | grep NEEDED → (none)
#
#   ccache-4.13.6-linux-x86_64-glibc/ccache
#     dynamically linked, interpreter /lib64/ld-linux-x86-64.so.2
#     NEEDED: libm, libgcc_s.so.1, libpthread, libc, ld-linux  (libgcc_s non-base)
#
# This mirror carries ONLY the `-musl-static` pair. When upstream ships both a
# fully-static and a dynamic build of the same tool, the static one is what gets
# published: it requires nothing of the host, so its platform keys are BARE — no
# `+libc.*` suffix — and one artifact serves glibc and musl hosts alike. The
# `-glibc` assets would need a `+libc.gnu`-tagged sibling and a libgcc_s runtime
# dependency, for zero added reach. Container legs (ubuntu + alpine + fedora)
# live in ../mirror-base.yml and are what turn the bare claim into evidence.
#
# darwin is one universal Mach-O (x86_64 + arm64 slices inside a single
# `ccache-<v>-darwin.tar.gz`), so both darwin keys point at the same asset.
#
# ─── Scope (verified against every in-range release, v4.13.1 … v4.13.6)
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   ccache-*-linux-{x86_64,aarch64}-glibc.tar.{xz,gz}  — dynamic; see above
#   ccache-*-linux-riscv64-*                           — no GHA runner
#   ccache-*-linux-*-musl-static.tar.gz                — .gz twin of the .xz
#   ccache-*.tar.{gz,xz} (no platform segment)         — source tarballs
#   *.minisig                                          — signature sidecars
#
# The anchored ^…$ regexes are what keep those out — `\.tar\.xz$` does not match
# the `.tar.gz` twins upstream added in v4.13.6, and `-musl-static` does not
# match `-glibc`. Resolution verified BOTH ways across EVERY in-range release
# (all 6 of v4.13.1 … v4.13.6): each of the six patterns matches EXACTLY one
# asset. A pattern matching zero is silently skipped, not an error — it would
# yield a green run with a missing platform.
assets:
  linux/amd64:
    - "^ccache-.*-linux-x86_64-musl-static\\.tar\\.xz$"
  linux/arm64:
    - "^ccache-.*-linux-aarch64-musl-static\\.tar\\.xz$"
  darwin/amd64:
    - "^ccache-.*-darwin\\.tar\\.gz$"
  darwin/arm64:
    - "^ccache-.*-darwin\\.tar\\.gz$"
  windows/amd64:
    - "^ccache-.*-windows-x86_64\\.zip$"
  windows/arm64:
    - "^ccache-.*-windows-aarch64\\.zip$"

asset_type:
  type: archive
  # Every archive wraps its payload in `ccache-<version>-<platform>/` with
  # `ccache` / `ccache.exe` at that directory's root next to the docs — no bin/.
  # Peeling the wrapper puts the executable at the content root, which is why
  # metadata.json's PATH is a bare ${installPath} and bin_scan is off.
  strip_components: 1

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  # v4.13 (i.e. 4.13.0) is tagged `v4.13` — the three-segment tag pattern skips
  # it — and the `-musl-static` asset layout only appears from v4.13 onward. The
  # first matching tag carrying that layout is v4.13.1.
  min: "4.13.1"
  new_per_run: 5
  poll_interval: "45 5-23/6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: ccache/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate. GitHub's licence API answers NOASSERTION
  # for this repo, so the id is read off upstream's own LICENSE.adoc: "either
  # version 3 of the License, or (at your option) any later version".
  # Copyleft — NOTICE.md carries the per-version Corresponding Source pointer
  # GPLv3 §6(d) requires, and every archive additionally ships upstream's own
  # GPL-3.0.txt / LICENSE.md inside the bundle.
  org.opencontainers.image.licenses: "GPL-3.0-or-later"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: ccache/ccache
  fork: ocx-contrib/index
